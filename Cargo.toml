[package]
name = "ghwatch"
version = "0.1.0"
edition = "2024"
description = "Vulnerability watch across a GitHub account's repositories: Dependabot alerts, secret scanning and OSV.dev enrichment."
license = "MIT"
repository = "https://github.com/atareao/ghwatch"
homepage = "https://atareao.es"
authors = ["Lorenzo Carbonell <lorenzo.carbonell.cerezo@gmail.com>"]
keywords = ["github", "dependabot", "security", "vulnerabilities", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `migrate` embebe y aplica el esquema en runtime (vía `Migrator`), sin exigir
# `DATABASE_URL` en compilación; `sqlite` + `runtime-tokio` son el motor y el
# runtime. No se activa `macros`: las consultas son en runtime, no `query!`.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.21"
# `toml` lee la configuración de ejecución (`~/.config/ghwatch/config.toml`, con
# precedencia entorno > fichero) y la Fase 7 reutilizará el mismo parser para la
# configuración del CLI, así que no es una dependencia específica del notificador.
toml = "0.9"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Los tests de informes y notificación escriben en disco: `tempfile` aporta
# directorios aislados que se limpian al soltarse, sin inventar nombres únicos
# ni dejar residuos en `std::env::temp_dir()`.
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints.clippy]
all = "deny"

[lints.rust]
unsafe_code = "forbid"
